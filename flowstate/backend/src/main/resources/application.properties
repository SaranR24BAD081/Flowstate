spring.application.name=flowstate
server.port=8089

# ---- Database (MySQL 8) ----
spring.datasource.url=jdbc:mysql://localhost:3306/flowstate_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:YOUR_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ---- JWT [REQ-JWT-04] ----
# Replace in production. Must be >= 256 bits (32 chars).
flowstate.jwt.secret=${JWT_SECRET:flowstate-super-secret-key-change-me-0123456789-abcdef}
flowstate.jwt.access-token-expiry-ms=900000
flowstate.jwt.refresh-token-expiry-ms=604800000
