spring.application.name=flowstate
server.port=8080

spring.datasource.url=jdbc:h2:mem:flowstate_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

flowstate.jwt.secret=test-secret-key-test-secret-key-test-secret-key-1234
flowstate.jwt.access-token-expiry-ms=900000
flowstate.jwt.refresh-token-expiry-ms=604800000
